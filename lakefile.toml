name = "ZetaCert"
version = "0.1.0"
defaultTargets = ["ZetaCert"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "ZetaCert"
globs = ["ZetaCert.+"]

[[require]]
name = "Zeta23"
path = "vendor/zeta23"

# Vendored from teal-sea/zeta-lab b09fa4dd2f21 (MIT): lean/ZetaLean (4 modules), hunts #132, #133, #137.
[[lean_lib]]
name = "ZetaLean"
globs = ["ZetaLean.Rigor", "ZetaLean.IntervalExp", "ZetaLean.IntervalCExp", "ZetaLean.HardyZ"]

[[lean_lib]]
name = "HardyFirstZero"
globs = ["HardyFirstZero.+"]

[[lean_lib]]
name = "HardyTenZeros"
globs = ["HardyTenZeros.+"]

[[lean_lib]]
name = "RHHeight"
globs = ["RHHeight", "RHHeight.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "RHHeight100"
globs = ["RHHeight100.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

# Vendored from antoine-olivier/rh-up-to-15-lean dec8fa913b6c (Apache-2.0), ported.
[[lean_lib]]
name = "ZetaZeros"
globs = ["ZetaZeros.+"]

[[lean_lib]]
name = "Zeros0to1000"
srcDir = "challenge"
roots = ["Zeros0to1000"]

[[lean_lib]]
name = "Zeros1000to2000"
srcDir = "challenge"
roots = ["Zeros1000to2000"]

[[lean_lib]]
name = "Zeros2000to3000"
srcDir = "challenge"
roots = ["Zeros2000to3000"]

[[lean_lib]]
name = "Zeros3000to4000"
srcDir = "challenge"
roots = ["Zeros3000to4000"]

[[lean_lib]]
name = "Zeros4000to5000"
srcDir = "challenge"
roots = ["Zeros4000to5000"]

[[lean_lib]]
name = "Zeros5000to6000"
srcDir = "challenge"
roots = ["Zeros5000to6000"]

[[lean_lib]]
name = "Zeros6000to7000"
srcDir = "challenge"
roots = ["Zeros6000to7000"]

[[lean_lib]]
name = "Zeros7000to8000"
srcDir = "challenge"
roots = ["Zeros7000to8000"]

[[lean_lib]]
