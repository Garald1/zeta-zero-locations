name = "ZetaCert"
version = "0.1.0"
defaultTargets = ["ZetaCert", "Zeros0to1000", "Zeros1000to2000", "Zeros2000to3000", "Zeros3000to4000", "Zeros4000to5000", "Zeros5000to6000", "Zeros6000to7000", "Zeros7000to8000", "Zeros8000to9000", "Zeros9000to10000", "Count10000", "Zeros0to1000Solution", "Zeros1000to2000Solution", "Zeros2000to3000Solution", "Zeros3000to4000Solution", "Zeros4000to5000Solution", "Zeros5000to6000Solution", "Zeros6000to7000Solution", "Zeros7000to8000Solution", "Zeros8000to9000Solution", "Zeros9000to10000Solution", "Count10000Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "ZetaCert"
globs = ["ZetaCert.+"]

[[require]]
name = "Zeta23"
path = "vendor/zeta23"

# Vendored from teal-sea/zeta-lab b09fa4dd2f21 (MIT): lean/ZetaLean (4 modules), hunts #132, #133, #137.
[[lean_lib]]
name = "ZetaLean"
globs = ["ZetaLean.Rigor", "ZetaLean.IntervalExp", "ZetaLean.IntervalCExp", "ZetaLean.HardyZ"]

[[lean_lib]]
name = "HardyFirstZero"
globs = ["HardyFirstZero.+"]

[[lean_lib]]
name = "HardyTenZeros"
globs = ["HardyTenZeros.+"]

[[lean_lib]]
name = "RHHeight"
globs = ["RHHeight", "RHHeight.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "RHHeight100"
globs = ["RHHeight100.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

# Vendored from antoine-olivier/rh-up-to-15-lean dec8fa913b6c (Apache-2.0), ported.
