name = "ZetaCert"
version = "0.1.0"
defaultTargets = ["ZetaCert"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "ZetaCert"
globs = ["ZetaCert.+"]

[[require]]
name = "Zeta23"
path = "vendor/zeta23"

# Vendored from teal-sea/zeta-lab b09fa4dd2f21 (MIT): lean/ZetaLean (4 modules), hunts #132, #133, #137.
[[lean_lib]]
name = "ZetaLean"
globs = ["ZetaLean.Rigor", "ZetaLean.IntervalExp", "ZetaLean.IntervalCExp", "ZetaLean.HardyZ"]

[[lean_lib]]
name = "HardyFirstZero"
globs = ["HardyFirstZero.+"]

[[lean_lib]]
name = "HardyTenZeros"
globs = ["HardyTenZeros.+"]

[[lean_lib]]
name = "RHHeight"
globs = ["RHHeight", "RHHeight.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "RHHeight100"
globs = ["RHHeight100.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

# Vendored from antoine-olivier/rh-up-to-15-lean dec8fa913b6c (Apache-2.0), ported.
[[lean_lib]]
name = "ZetaZeros"
globs = ["ZetaZeros.+"]

[[lean_lib]]
name = "Challenge1000"
srcDir = "challenge"
roots = ["Challenge1000"]

[[lean_lib]]
name = "Challenge10000"
srcDir = "challenge"
roots = ["Challenge10000"]
