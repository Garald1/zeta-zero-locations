# Written by Claude Code from Palomar's CONTRIBUTING.md and the upstream formalization.yaml v0.4
# schema (re-read 2026-11-08). Items marked TODO need Harald's decision.
# One file for all eleven Comparator configurations (challenge/comparator-*.json).
version: v0.4

project:
  name: "Kernel-checked locations of the zeros of the Riemann zeta function up to height 10 000"
  description: >
    For every range (1000 j, 1000 (j+1)], j = 0, ..., 9, a Lean proof that every zero of
    Mathlib's riemannZeta with imaginary part in that range is simple, lies on the critical line,
    and has its ordinate within 10^-20 of one of the listed values (each of which has exactly one
    zero near it), together with the exact number of such zeros; and that there are exactly
    10 142 zeros with 0 < Im s <= 10 000, all simple and on the critical line. The proofs check
    each zero with a certificate evaluated by the Lean kernel (Euler-Maclaurin, a contraction
    argument and the functional equation), and count the zeros with the argument principle
    (zeta-lab's exact_argument) between heights where Re zeta is certified positive on
    [1/2, 2]. Numerical values computed with Arb are used only as candidate data; every
    inequality is re-proved in the kernel. Only the axioms propext, Classical.choice and
    Quot.sound are used.
  authors:
    - "Harald Helfgott"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Harald Helfgott"

classification:
  arxiv: [math.NT, cs.LO]
  msc2020: [11M26, 11Y35, 68V20]

automation:
  methods:
    - method: agent
      note: >
        The formalization (evaluator, soundness proofs, certificates, assembly) was written by
        Claude Code (Anthropic) working from a plan and challenge statements written by
        Harald Helfgott.

review:
  status: unchecked  # TODO(Harald): change if you review the statements/proofs before submitting

sources:
  # Origin rule (Palomar CONTRIBUTING): a new proof of a known result is source-based, with
  # relationship independently-proves. Each entry below was opened (2026-11-08); the Platt 2017
  # details are from its accepted manuscript (Bristol Research Portal) and Crossref.
  - title: "Isolating some non-trivial zeros of zeta"
    authors: ["David J. Platt"]
    type: paper
    id: "doi:10.1090/mcom/3198"
    location: "Math. Comp. 86 (2017), no. 307, 2449-2467"
    relationship: independently-proves
    note: >
      Rigorously isolates the non-trivial zeros with imaginary part up to 30 610 046 000 to an
      absolute precision of 2^-102, verifying RH to that height; this contains the results of every
      configuration here, which re-prove them independently by kernel-checked certificates.
  - title: "Computing pi(x) analytically"
    authors: ["David J. Platt"]
    type: paper
    id: "doi:10.1090/S0025-5718-2014-02884-6"
    location: "Math. Comp. 84 (2015), no. 293, 1521-1535"
    relationship: background
    note: "The algorithm the LMFDB credits for its database of zeta zeros."
  - title: "LMFDB: zeros of the Riemann zeta function"
    type: other
    id: "https://www.lmfdb.org/zeros/zeta/"
    relationship: background
    note: >
      The 103 800 788 359 zeros with imaginary part in (0, 30 610 046 000], computed by D. Platt,
      stored to 2^-102, completeness checked by a rigorous version of Turing's method.
  - title: "Tables of the first 15000 zeros of the Riemann zeta function to 28 significant digits, and related quantities"
    authors: ["H. J. J. te Riele"]
    type: other
    id: "https://ir.cwi.nl/pub/9001"
    location: "Report NW 67/79, Stichting Mathematisch Centrum, Amsterdam, 1979"
    relationship: background
  - title: "On the distribution of spacings between zeros of the zeta function"
    authors: ["A. M. Odlyzko"]
    type: paper
    id: "doi:10.1090/S0025-5718-1987-0866115-0"
    location: "Math. Comp. 48 (1987), no. 177, 273-308"
    relationship: background
    note: "Tables of zeros: https://www-users.cse.umn.edu/~odlyzko/zeta_tables/ (first 100 000 zeros to within 3e-9)."
  - title: "Arb (now FLINT): acb_dirichlet_zeta_zeros"
    type: other
    id: "https://arblib.org/acb_dirichlet.html"
    relationship: background
    note: >
      The listed ordinates in the challenge files were computed with acb_dirichlet_zeta_zeros
      (160-bit ball arithmetic). They are candidate data only; the proofs re-check every bound in
      the Lean kernel.

related_formalizations:
  - id: teal-sea/zeta-lab
    relationship: builds-on
    note: "RH up to height 100 with exact count, exact_argument, Gamma increment (MIT; vendored)."
  - id: antoine-olivier/rh-up-to-15-lean
    relationship: builds-on
    note: "Euler-Maclaurin for zeta with explicit remainder, zeta'' bounds (Apache-2.0; vendored)."
  - id: anthropics/zeta-23-lean
    relationship: builds-on
    note: "Ncount, mu and related definitions, via zeta-lab's copy (Apache-2.0)."
  - id: teorth/IEANTN
    relationship: other
    note: "Strip lemmas restated and cited in the files that use them (Apache-2.0)."

status:
  sorry_count: 0
  axioms: [propext, Classical.choice, Quot.sound]
