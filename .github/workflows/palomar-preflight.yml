# Palomar's own verifier, run as a predictive preflight (as recommended by
# https://submit.palomar-registry.org/llms.txt): the same job Palomar runs on a submission
# (lake build of the solution, export, Comparator with the Lean kernel and NanoDa), with the same
# time and memory ceilings. It has no Palomar state or credentials.
name: Palomar preflight
on:
  workflow_dispatch:
    inputs:
      config:
        description: Comparator configuration, e.g. challenge/comparator-Zeros9000to10000.json
        required: true
        type: string
      request_id:
        description: Exactly 12 lowercase alphanumeric characters
        required: true
        type: string
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"${{ inputs.config }}","authorization_relationship":"I am a responsible author or maintainer"}'
